plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'org.agentos.agent.bridge'
version = '0.1.0'

android {
  namespace 'org.agentos.agent.bridge'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation 'androidx.activity:activity:1.13.0'
  implementation 'androidx.core:core:1.17.0'
  // The route resolution suspends on the app context's background scope.
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
  testImplementation 'junit:junit:4.13.2'
  // The tile parses gateway JSON; the android.jar org.json is a stub in local unit tests.
  testImplementation 'org.json:json:20250517'
}
